name: CI

# O código versionado é a fonte de verdade. CI valida e publica; não reescreve módulos.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VITE_SUPABASE_URL: https://ogmtzxotpukddzowhqwl.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_vkhFOCSIvSbWifFCy6DjIg_9QJeYd38

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync official company logos
        run: node scripts/sync-official-company-logos.mjs

      - name: Use local official company logos in print
        run: python3 scripts/use-local-official-company-logos.py

      - name: Install dependencies
        run: npm install

      - name: Architecture guard
        run: node scripts/architecture-guard.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deploy-cloudflare:
    name: Deploy Cloudflare Workers
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: |
          python3 scripts/generate-pwa-icons.py
          npm run build

      - name: Deploy to Cloudflare Workers
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
