name: CI

# O código versionado é a fonte de verdade. CI valida e publica; não reescreve módulos.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VITE_SUPABASE_URL: https://ogmtzxotpukddzowhqwl.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_vkhFOCSIvSbWifFCy6DjIg_9QJeYd38

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync official company logos
        run: node scripts/sync-official-company-logos.mjs

      - name: Use local official company logos in print
        run: python3 scripts/use-local-official-company-logos.py

      - name: Install dependencies
        run: npm install

      - name: Architecture guard
        run: node scripts/architecture-guard.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload production build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist
          retention-days: 1

  deploy:
    name: Deploy Netlify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: dist

      - name: Validate Netlify credentials
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || (echo "Missing secret: NETLIFY_AUTH_TOKEN" && exit 1)
          test -n "$NETLIFY_SITE_ID" || (echo "Missing secret: NETLIFY_SITE_ID" && exit 1)

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@23 deploy --prod --dir=dist --site="$NETLIFY_SITE_ID" --message="GitHub ${{ github.sha }}"
