name: Portal Colaborador - validação sem deploy
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feature/portal-colaborador-ponto-gps'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
