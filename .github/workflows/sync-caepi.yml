name: Sincronizar CAEPI oficial
on:
  workflow_dispatch:
  schedule:
    - cron: '25 8 * * 1'
permissions:
  contents: read
jobs:
  import-caepi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar credenciais privadas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo 'Configure SUPABASE_URL nos secrets'; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo 'Configure SUPABASE_SERVICE_ROLE_KEY nos secrets'; exit 1; }
      - name: Importar base CAEPI publicada pelo MTE
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/import-caepi.mjs
