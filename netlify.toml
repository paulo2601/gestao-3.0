[build]
  command = "python3 scripts/generate-pwa-icons.py && npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/gestao-icon-192.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/gestao-icon-512.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=3600"
